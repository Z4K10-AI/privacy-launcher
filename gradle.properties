# JVM settings for Gradle. 2 GB is plenty for this project and keeps a
# 16 GB MacBook responsive while building.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Reuses the configuration phase between builds; roughly halves incremental
# build time on this project.
org.gradle.configuration-cache=true

# AndroidX is required by Jetpack Compose.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only generate the resource fields we actually use.
android.nonTransitiveRClass=true
