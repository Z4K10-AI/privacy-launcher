# The on-device tests, on emulators running Android 11 and Android 15.
#
# Too slow for every push (each takes the best part of an hour on GitHub's
# machines), so they run once a week and whenever someone starts them from
# the Actions tab. The fuller checks in tools/soak.sh, which drive the real
# app, are run by hand; see docs/testing.md.
name: Emulator tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC

permissions:
  contents: read

jobs:
  device-tests:
    name: Device tests, Android API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle, and check the wrapper is the genuine one
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its tests before the emulator starts
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run the device tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          ram-size: 4096M
          # Left on: the tests were written and pass with animations running,
          # as they do on a phone.
          disable-animations: false
          script: ./gradlew connectedDebugAndroidTest

      - name: Keep the reports if something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          retention-days: 14
