# Build, lint and the tests that need no device, on every push and pull
# request. Nothing here needs a secret, so it runs the same for pull
# requests from forks.
#
# Every outside action is pinned to an exact commit, with its version in a
# comment, so what runs here cannot change unless this file does.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle, and check the wrapper is the genuine one
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true

      - name: Build, lint, and run the JVM tests
        run: ./gradlew --stacktrace assembleDebug assembleRelease lintDebug testDebugUnitTest

      - name: Check the privacy promises on the built app
        # No signing key here, so the release build comes out unsigned.
        run: tools/apkcheck.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Colour contrast against WCAG AA
        run: python3 tools/contrast.py

      - name: Licence of every library in the app
        run: python3 tools/licences.py

      - name: Links in the documentation
        run: python3 tools/checklinks.py

      - name: Keep the reports if something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
          retention-days: 14
