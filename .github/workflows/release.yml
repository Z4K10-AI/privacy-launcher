# Builds the APK from a tag, signs it, and publishes it as a GitHub release.
#
#   git tag launcher-v1.0 && git push origin launcher-v1.0
#
# The signing key is never in the repository. It lives only in four
# repository secrets (Settings > Secrets and variables > Actions), is written
# to a temporary folder outside the project for the length of the build, and
# is deleted afterwards whatever happens. docs/building.md, "Releasing",
# says how to make the key and set the secrets.
#
# It will not publish an unsigned build, a build whose version does not
# match the tag, or a build that fails tools/apkcheck.sh.
name: Release

on:
  push:
    tags:
      - "launcher-v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and publish the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # to create the release, and nothing else
    env:
      PL_KEYSTORE_BASE64: ${{ secrets.PL_KEYSTORE_BASE64 }}
      PL_KEYSTORE_PASSWORD: ${{ secrets.PL_KEYSTORE_PASSWORD }}
      PL_KEY_ALIAS: ${{ secrets.PL_KEY_ALIAS }}
      PL_KEY_PASSWORD: ${{ secrets.PL_KEY_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle, with nothing reused from earlier builds
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-disabled: true

      - name: Check the signing key's secrets are all set
        run: |
          missing=""
          for name in PL_KEYSTORE_BASE64 PL_KEYSTORE_PASSWORD PL_KEY_ALIAS PL_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are not set:$missing. See docs/building.md, Releasing."
            exit 1
          fi

      - name: Check the tag matches the version in the build
        run: |
          tag="${GITHUB_REF_NAME#launcher-v}"
          name="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          if [ "$tag" != "$name" ]; then
            echo "::error::The tag says $tag but app/build.gradle.kts says versionName $name."
            exit 1
          fi

      - name: Put the signing key in place, outside the project folder
        run: |
          dir="$RUNNER_TEMP/signing"
          mkdir -p "$dir"
          chmod 700 "$dir"
          umask 077
          printf '%s' "$PL_KEYSTORE_BASE64" | base64 --decode > "$dir/release.p12"
          {
            printf 'storeFile=release.p12\n'
            printf 'storePassword=%s\n' "$PL_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$PL_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$PL_KEY_PASSWORD"
          } > "$dir/keystore.properties"
          echo "PL_KEYSTORE_PROPERTIES=$dir/keystore.properties" >> "$GITHUB_ENV"

      - name: Build the release
        run: ./gradlew --no-build-cache --stacktrace assembleRelease

      - name: Check the privacy promises on the exact file being published
        run: tools/apkcheck.sh app/build/outputs/apk/release/app-release.apk

      - name: Verify the signature, and write the checksums and release notes
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/
          "$apksigner" verify --verbose --print-certs out/app-release.apk > out/signing.txt
          cat out/signing.txt
          cert="$(sed -n 's/.*certificate SHA-256 digest: //p' out/signing.txt | head -1)"
          [ -n "$cert" ] || { echo "::error::The APK is not signed."; exit 1; }
          (cd out && sha256sum app-release.apk > SHA256SUMS)
          code="$(sed -n 's/^ *versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          {
            echo "## What is new"
            echo
            cat "fastlane/metadata/android/en-US/changelogs/$code.txt" 2>/dev/null || echo "See CHANGELOG.md."
            echo
            echo "## Check your download"
            echo
            echo "- SHA-256 of \`app-release.apk\`: \`$(cut -d' ' -f1 out/SHA256SUMS)\`"
            echo "- SHA-256 of the signing certificate: \`$cert\`"
            echo
            echo "\`sha256sum -c SHA256SUMS\` checks the file you downloaded, and"
            echo "\`apksigner verify --print-certs app-release.apk\` shows its certificate."
            echo
            echo "Tested on Android emulators only so far, not yet on a physical phone."
          } > out/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/app-release.apk out/SHA256SUMS \
            --title "Privacy Launcher ${GITHUB_REF_NAME#launcher-v}" \
            --notes-file out/notes.md \
            --verify-tag

      - name: Remove the signing key from the machine
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
